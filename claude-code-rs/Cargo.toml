[package]
name = "claude-code-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the Anthropic Claude Code CLI"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# CLI Parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP Client for Anthropic API
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async traits for Tools/Plugins
async-trait = "0.1"

# Terminal UI (replacing React Ink)
ratatui = "0.26"
crossterm = "0.27"
inquire = "0.7" # For simple prompts and selections

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0.0"
