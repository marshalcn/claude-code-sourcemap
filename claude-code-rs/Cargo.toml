[package]
name = "claude-code-rs"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the Anthropic Claude Code CLI"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# CLI Parsing
clap = { version = "4.5", features = ["derive"] }

# HTTP Client for Anthropic API
reqwest = { version = "0.12", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async traits for Tools/Plugins
async-trait = "0.1"

# Terminal UI
ratatui = "0.29.0" # Match the version used by tui-textarea
crossterm = "0.28.1" # Match the version used by tui-textarea
tui-textarea = { version = "0.7.0", features = ["crossterm", "ratatui"] }
inquire = "0.7"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = "0.7.18"
dirs = "6.0.0"
glob = "0.3.3"
lazy_static = "1.5.0"
chrono = "0.4.44"
regex = "1.12.3"
walkdir = "2.5.0"
serde_yaml = "0.9.34"
bytes = "1.11.1"
enigo = "0.6.1"
taffy = "0.10.0"
